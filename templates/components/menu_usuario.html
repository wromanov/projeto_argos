{% load usuarios_extras %}
<details class="user-menu">
  <summary aria-label="Abrir menu de {{ request.user|nome_exibicao_usuario }}">
    <span class="portal-avatar" aria-hidden="true">{{ request.user|iniciais_usuario }}</span>
    <span class="portal-user__name">{{ request.user|nome_exibicao_usuario }}</span>
    <span class="user-menu__indicator" aria-hidden="true"></span>
  </summary>
  <div class="user-menu__panel">
    <a href="{% url 'usuarios:perfil' %}"{% if current_namespace == 'usuarios' and current_url_name == 'perfil' %} aria-current="page"{% endif %}>Meu perfil</a>
    <a href="{% url 'usuarios:editar_perfil' %}">Editar perfil</a>
    <a href="{% url 'usuarios:alterar_senha' %}">Alterar senha</a>
    {% if request.user.is_staff %}<a href="{% url 'admin:index' %}">Administração</a>{% endif %}
    <form method="post" action="{% url 'usuarios:logout' %}">{% csrf_token %}<button class="button button--ghost" type="submit">Sair</button></form>
  </div>
</details>
